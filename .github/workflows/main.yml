name: DivineCode CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    # 👉 FIX: Spin up a temporary Redis container strictly for the GitHub Actions runner
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Automatically caches node_modules for faster builds

    - name: Install Monorepo Dependencies
      run: npm install

    - name: Generate Prisma Client
      working-directory: ./
      run: npx prisma generate

    - name: Build API (Backend)
      working-directory: ./apps/api
      run: npm run build

    - name: Build Web (Frontend)
      working-directory: ./apps/web
      run: npm run build

    - name: Verify BullMQ Worker Build
      working-directory: ./apps/api
      # 👉 FIX: Explicitly point the worker to the temporary Redis container we spun up above
      env:
        REDIS_URL: redis://localhost:6379
run: node --check dist/workers/index.js && echo "Worker compiled and verified successfully."