envVarGroups:
  - name: divinecode-shared-secrets
    envVars:
      - key: NODE_ENV
        value: production
      - key: JUDGE_WORKER_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN # 👈 CHANGED: Matches index.ts CORS policy
        value: "https://divine-code-web.vercel.app/" 
      - key: NEXTAUTH_SECRET # 👈 ADDED: Required to decode API JWTs
        value: "your-super-secure-nextauth-secret-here" # 👉 MUST exactly match the NEXTAUTH_SECRET in Vercel

services:
  # 1. Managed Redis (Handles Socket.io scaling and BullMQ jobs)
  - type: keyvalue
    name: divinecode-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # 2. Main API & WebSocket Server
  - type: web
    name: divinecode-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx turbo run build --filter=api
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start --workspace apps/api
    envVars:
      - fromGroup: divinecode-shared-secrets
      - key: ENABLE_API_WORKERS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: divinecode-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: divinecode-redis
          property: connectionString
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston

  # 3. Background Worker (Processes standard judgements & external syncs off the main thread)
  - type: worker
    name: divinecode-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx turbo run build --filter=api
    startCommand: npm run worker:start --workspace apps/api
    envVars:
      - fromGroup: divinecode-shared-secrets
      - key: ENABLE_API_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: divinecode-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: divinecode-redis
          property: connectionString
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston

databases:
  # 4. Managed PostgreSQL Database
  - name: divinecode-postgres
    databaseName: divinecode
    user: divinecode
    plan: starter