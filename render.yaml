services:
  # --- NEW: PISTON COMPILER SERVICE ---
  - type: web
    name: divinecode-piston
    image: engineeraman/piston  # <-- REMOVED docker.io/
    plan: starter
    port: 2000
    envVars:
      - key: PISTON_RUN_DIR
        value: /tmp
      - key: ISOLATE_ROOT
        value: /tmp
  
  # --- EXISTING SERVICES ---
  - type: keyvalue
    name: divinecode-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: divinecode-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build --workspace apps/api
    preDeployCommand: npm run prisma:deploy
    startCommand: npm run start --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_API_WORKERS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: divinecode-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: divinecode-redis
          property: connectionString
      # --- UPDATED: Connects to internal Piston Service ---
      - key: JUDGE0_URL
        value: http://divinecode-piston:2000/api/v2/execute
      - key: JUDGE_WORKER_SECRET
        generateValue: true

  - type: worker
    name: divinecode-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build --workspace apps/api
    startCommand: npm run worker:start --workspace apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_API_WORKERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: divinecode-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: divinecode-redis
          property: connectionString
      # --- UPDATED: Connects to internal Piston Service ---
      - key: JUDGE0_URL
        value: http://divinecode-piston:2000/api/v2/execute
      - key: JUDGE_WORKER_SECRET
        generateValue: true

databases:
  - name: divinecode-postgres
    databaseName: divinecode
    user: divinecode
    plan: starter